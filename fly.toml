# fly.toml app configuration for mp4-extractor
# Fly.io free plan: max 2048 MiB memory, shared CPU

app = 'mp4-extractor'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
