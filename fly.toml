# fly.toml app configuration file generated for mp4-extractor on 2026-08-20T00:23:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mp4-extractor'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  concurrency = { hard_limit = 10, soft_limit = 5, type = 'requests' }

  [http_service.http_check]
    interval = "30s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "10s"
    tls_skip_verify = false

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

# 1GB RAM — needed for Chromium (Playwright)

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-2x'
