# fly.toml app configuration file generated for mp4-extractor on 2026-08-07T04:54:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mp4-extractor'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Smoke check config - give Playwright more time to start
  [http_service.http_check]
    interval = "30s"
    grace_period = "120s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "10s"
    tls_skip_verify = false

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

# ✨ حجم صغير — 1GB RAM + 1 shared CPU (كافي جداً لـ aiohttp + Playwright lazy)
# لو حملت قبل كده 8GB أو 128GB، Fly.io بيرفض بسبب "insufficient memory available"
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024



