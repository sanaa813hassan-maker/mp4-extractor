# fly.toml — mp4-extractor (proxy-only v2.0)
#
# ✨ النسخة دي proxy فقط (مفيهاش Playwright) — مستقرة جداً على Fly.io
# - 256MB RAM (كافي جداً لـ aiohttp + proxy)
# - 1 shared CPU
# - hard_limit=100 (proxy خفيف، يقدر يخدم كتير)
#
# الـ extract و videasy اتنقلوا لـ Vercel باستخدام @sparticuz/chromium

app = 'mp4-extractor'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.http_check]
    interval = "30s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "10s"
    tls_skip_verify = false

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

# ✨ 256MB — aiohttp + proxy بيشغلوا على 30-50MB بس
[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
