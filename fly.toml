# fly.toml app configuration file generated for mp4-extractor on 2026-08-07T04:54:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mp4-extractor'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
